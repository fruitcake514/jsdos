<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eXo Gallery</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/vendor/jsdos-v7/js-dos.css" />
    <script src="/vendor/jsdos-v7/js-dos.js"></script>
  </head>
  <body>
    <div class="bg-glow"></div>
    <main class="layout">
      <header class="topbar">
        <h1>eXo Gallery</h1>
        <input id="search" type="search" placeholder="Search games..." />
      </header>

      <section>
        <p id="status">Scanning libraries...</p>
        <div id="gallery" class="gallery"></div>
      </section>

      <section class="player-wrap">
        <h2>Player</h2>
        <div id="player" class="player"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
